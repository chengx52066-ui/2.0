<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液态玻璃 · 手部特效</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;font-family:'DM Mono',monospace;color:#fff;overflow:hidden;width:100vw;height:100vh}
#loader{position:fixed;inset:0;background:#0a0a12;display:flex;align-items:center;justify-content:center;z-index:1000;transition:opacity .8s ease,visibility .8s}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-content{text-align:center;width:min(360px,85vw)}
.loader-title{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,3.2rem);font-weight:700;letter-spacing:.15em;background:linear-gradient(135deg,#ff6b9d,#c44dff,#4dabff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.loader-sub{font-size:.65rem;letter-spacing:.5em;color:rgba(255,255,255,.3);margin-bottom:2.8rem}
.pbar{width:100%;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:1.2rem}
.pfill{height:100%;width:0%;background:linear-gradient(90deg,#ff6b9d,#c44dff,#4dabff);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.pstatus{font-size:.7rem;color:rgba(255,255,255,.5);letter-spacing:.08em;min-height:1.4em;transition:all .3s}
.psteps{margin-top:2.2rem;display:flex;gap:1.5rem;justify-content:center}
.pstep{font-size:.58rem;letter-spacing:.08em;color:rgba(255,255,255,.15);transition:color .3s}
.pstep.active{color:rgba(255,255,255,.7)}
.pstep.done{color:#c44dff}

#output{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:contain;background:#0a0a12}
.hud{position:fixed;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:6px;padding:6px 14px;font-size:.7rem;letter-spacing:.08em}
#fps{top:16px;right:16px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.06)}
#mode-hud{top:16px;left:16px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.08);font-family:'Syne',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.1em}
#rec-dot{top:16px;left:50%;transform:translateX(-50%);background:rgba(180,20,20,.6);border:1px solid rgba(255,60,60,.4);display:none;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:8px 22px;border-radius:8px;font-size:.75rem;letter-spacing:.06em;backdrop-filter:blur(10px);z-index:200;animation:ta 2.2s ease forwards;pointer-events:none;border:1px solid rgba(255,255,255,.08)}
@keyframes ta{0%{opacity:0;transform:translateX(-50%) translateY(-6px)}8%{opacity:1;transform:translateX(-50%) translateY(0)}82%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;background:#fff;z-index:300;animation:fl .35s ease forwards;pointer-events:none}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}

#ctrls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:100;flex-wrap:wrap;justify-content:center;padding:0 16px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .22s cubic-bezier(.4,0,.2,1);font-family:'DM Mono',monospace;user-select:none;min-width:60px}
.cbtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.cbtn:active{transform:translateY(0);transition-duration:.1s}
.cbtn.rec{background:rgba(220,40,40,.25);border-color:rgba(255,60,60,.5);animation:rp 1.5s ease infinite}
@keyframes rp{0%,100%{box-shadow:0 0 0 0 rgba(255,60,60,.3)}50%{box-shadow:0 0 0 6px rgba(255,60,60,0)}}
.bi{font-size:1.1rem;line-height:1}
.bl{font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.cbtn.on .bl{color:#4dabff}
#kbd{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:90;opacity:.25;font-size:.53rem;letter-spacing:.06em;color:rgba(255,255,255,.5)}
.kbd{display:inline-block;padding:1px 5px;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-family:'DM Mono',monospace;margin-right:2px}
#error{position:fixed;inset:0;background:#0a0a12;display:none;align-items:center;justify-content:center;z-index:2000;flex-direction:column;gap:16px;text-align:center;padding:24px}
#error.show{display:flex}
#error h2{font-family:'Syne',sans-serif;font-size:1.4rem;color:#ff6b9d}
#error p{color:rgba(255,255,255,.5);font-size:.78rem;max-width:420px;line-height:1.7}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-content">
    <div class="loader-title">液态玻璃</div>
    <div class="loader-sub">LIQUID GLASS</div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <div class="pstatus" id="pstatus">初始化中...</div>
    <div class="psteps">
      <span class="pstep" id="s1">WebGL</span>
      <span class="pstep" id="s2">脚本</span>
      <span class="pstep" id="s3">模型</span>
      <span class="pstep" id="s4">摄像头</span>
    </div>
  </div>
</div>

<div id="error"><h2>初始化失败</h2><p id="emsg"></p></div>

<div id="app" style="display:none">
  <video id="cam" playsinline style="display:none"></video>
  <canvas id="maskC" style="display:none"></canvas>
  <canvas id="blurC" style="display:none"></canvas>
  <canvas id="output"></canvas>
  <div class="hud" id="fps">-- FPS</div>
  <div class="hud" id="mode-hud">液态玻璃</div>
  <div class="hud" id="rec-dot">● REC</div>
  <div id="kbd">
    <span><span class="kbd">Space</span>切换</span>
    <span><span class="kbd">S</span>截图</span>
    <span><span class="kbd">R</span>录屏</span>
    <span><span class="kbd">B</span>背景</span>
  </div>
  <div id="ctrls">
    <button class="cbtn" id="bMode"><span class="bi">✦</span><span class="bl">切换</span></button>
    <button class="cbtn" id="bShot"><span class="bi">◉</span><span class="bl">截图</span></button>
    <button class="cbtn" id="bRec"><span class="bi">●</span><span class="bl">录屏</span></button>
    <button class="cbtn" id="bBg"><span class="bi">▣</span><span class="bl">背景</span></button>
    <input type="file" id="bgIn" accept="image/*" style="display:none">
  </div>
</div>

<script>
"use strict";

// ============================================================
//  LOGGING
// ============================================================
const LOG = (...a) => console.log('[Glass]', ...a);

// ============================================================
//  PROGRESS
// ============================================================
function setProgress(pct, text, step) {
  document.getElementById('pfill').style.width = pct + '%';
  document.getElementById('pstatus').textContent = text || '';
  LOG(pct + '%', text);
  if (step !== undefined) {
    for (let i = 1; i <= 4; i++) {
      const el = document.getElementById('s' + i);
      el.classList.toggle('done', i < step);
      el.classList.toggle('active', i === step);
    }
  }
}

function showError(msg) {
  document.getElementById('emsg').textContent = msg;
  document.getElementById('error').classList.add('show');
  document.getElementById('loader').classList.add('hidden');
  LOG('ERROR:', msg);
}

function showToast(t) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = t;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2300);
}

const delay = ms => new Promise(r => setTimeout(r, ms));

// ============================================================
//  SHADERS — fixed u_camera → u_cam typo
// ============================================================
const VERT = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main(){
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const FRAG = `
precision highp float;
uniform sampler2D u_cam;
uniform sampler2D u_mask;
uniform sampler2D u_bg;
uniform float u_time;
uniform vec2 u_res;
uniform float u_mode;
uniform float u_hasBg;
varying vec2 v_uv;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<5;i++){v+=a*noise(p);p*=2.0;a*=0.5;}
  return v;
}
float edge(vec2 uv,float r){
  vec2 px=vec2(r/u_res.x,0.0),py=vec2(0.0,r/u_res.y);
  float l=texture2D(u_mask,uv-px).r,ri=texture2D(u_mask,uv+px).r;
  float t=texture2D(u_mask,uv-py).r,b=texture2D(u_mask,uv+py).r;
  return length(vec2(ri-l,b-t));
}

void main(){
  vec2 uv=v_uv;
  vec2 muv=vec2(1.0-uv.x,uv.y);
  float m=texture2D(u_mask,muv).r;
  m=smoothstep(0.02,0.45,m);
  float t=u_time;

  /* --- fallback bg: u_cam instead of u_camera --- */
  vec2 baseUV=u_hasBg>0.5 ? uv : muv;
  vec4 bg=u_hasBg>0.5 ? texture2D(u_bg,uv) : texture2D(u_cam,muv);

  /* ======== MODE 0: LIQUID GLASS ======== */
  if(u_mode<0.5){
    vec2 np=uv*4.0;
    float n1=fbm(np+t*0.22);
    float nc=fbm(np+t*0.22);
    float nr=fbm(np+vec2(0.008,0.0)+t*0.22);
    float nt=fbm(np+vec2(0.0,0.008)+t*0.22);
    vec2 grad=vec2(nr-nc,nt-nc);
    vec2 ruv=baseUV+grad*m*0.018;
    float ca=m*0.004+edge(muv,2.0)*0.008;
    vec3 col;
    if(u_hasBg>0.5){
      col.r=texture2D(u_bg,ruv+vec2(ca,0.0)).r;
      col.g=texture2D(u_bg,ruv).g;
      col.b=texture2D(u_bg,ruv-vec2(ca,0.0)).b;
    }else{
      col.r=texture2D(u_cam,ruv+vec2(ca,0.0)).r;
      col.g=texture2D(u_cam,ruv).g;
      col.b=texture2D(u_cam,ruv-vec2(ca,0.0)).b;
    }
    float e=edge(muv,1.5);
    float pulse=0.7+0.3*sin(t*2.5+n1*5.0);
    col+=e*vec3(0.92,0.96,1.0)*pulse*2.8;
    float spec=pow(max(0.0,1.0-abs(n1-0.5)*4.0),5.0);
    col+=spec*m*0.14;
    col*=mix(vec3(1.0),vec3(1.03,0.98,0.96),m*0.35);
    gl_FragColor=mix(bg,vec4(col,1.0),m);

  /* ======== MODE 1: NEON EDGE ======== */
  }else if(u_mode<1.5){
    float e=edge(muv,2.0);
    e=smoothstep(0.0,0.6,e);
    float g=edge(muv,5.0);
    g=smoothstep(0.0,0.4,g);
    float n=fbm(uv*5.0+t*0.3);
    float hue=t*0.4+n*0.3;
    vec3 neon=0.5+0.5*cos(6.28318*(hue+vec3(0.0,0.33,0.67)));
    float pulse=0.6+0.4*sin(t*3.0+n*4.0);
    vec3 res=bg.rgb;
    res+=g*neon*pulse*1.2;
    res+=e*neon*pulse*3.5;
    res+=m*neon*pulse*0.06;
    gl_FragColor=vec4(res,1.0);

  /* ======== MODE 2: ENERGY SHIELD ======== */
  }else{
    float e=edge(muv,1.5);
    float g=edge(muv,4.0);
    float field=fbm(uv*6.0+t*0.4);
    float ep=0.5+0.5*sin(t*4.0+field*6.283);
    vec3 ec=mix(vec3(1.0,0.45,0.08),vec3(1.0,0.92,0.3),ep);
    vec3 res=bg.rgb;
    res+=smoothstep(0.0,0.5,g)*ec*ep*1.6;
    res+=smoothstep(0.0,0.6,e)*ec*3.2;
    float inner=fbm(uv*8.0+t*0.6);
    res+=m*inner*0.14*ec*(0.5+0.5*sin(t*5.0));
    for(int i=0;i<4;i++){
      float fi=float(i);
      vec2 puv=uv*(10.0+fi*3.0)+vec2(t*(0.2+fi*0.1));
      float p=step(0.93,noise(puv));
      res+=p*m*ec*0.55;
    }
    gl_FragColor=vec4(res,1.0);
  }
}`;

// ============================================================
//  WEBGL
// ============================================================
let gl, prog, uLoc = {};
let texCam, texMask, texBg;

function initGL() {
  const c = document.getElementById('output');
  gl = c.getContext('webgl', {
    alpha: false,
    antialias: false,
    preserveDrawingBuffer: true,
  });
  if (!gl) { showError('浏览器不支持 WebGL'); return false; }

  function mk(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(s);
      LOG('Shader error:', info);
      showError('Shader 编译失败: ' + info);
      return null;
    }
    return s;
  }

  const vs = mk(gl.VERTEX_SHADER, VERT);
  const fs = mk(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return false;

  prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    showError('Shader 链接失败: ' + gl.getProgramInfoLog(prog));
    return false;
  }
  gl.useProgram(prog);
  LOG('WebGL OK');

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  ['u_cam','u_mask','u_bg','u_time','u_res','u_mode','u_hasBg'].forEach(n => {
    uLoc[n] = gl.getUniformLocation(prog, n);
  });

  function mkTex() {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
      new Uint8Array([0,0,0,255]));
    return t;
  }
  texCam = mkTex();
  texMask = mkTex();
  texBg = mkTex();
  gl.uniform1i(uLoc.u_cam, 0);
  gl.uniform1i(uLoc.u_mask, 1);
  gl.uniform1i(uLoc.u_bg, 2);
  return true;
}

// ============================================================
//  HAND MASK
// ============================================================
const CONNS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],
  [15,16],[13,17],[17,18],[18,19],[19,20],[0,17],
];

const maskCvs = document.getElementById('maskC');
const blurCvs = document.getElementById('blurC');
const maskCtx = maskCvs.getContext('2d');
const blurCtx = blurCvs.getContext('2d');

function drawMask(lm) {
  const w = maskCvs.width, h = maskCvs.height;
  maskCtx.clearRect(0, 0, w, h);
  maskCtx.fillStyle = '#fff';
  maskCtx.strokeStyle = '#fff';
  maskCtx.lineWidth = 38;
  maskCtx.lineCap = 'round';
  maskCtx.lineJoin = 'round';
  CONNS.forEach(([a, b]) => {
    maskCtx.beginPath();
    maskCtx.moveTo(lm[a].x * w, lm[a].y * h);
    maskCtx.lineTo(lm[b].x * w, lm[b].y * h);
    maskCtx.stroke();
  });
  lm.forEach(p => {
    maskCtx.beginPath();
    maskCtx.arc(p.x * w, p.y * h, 20, 0, Math.PI * 2);
    maskCtx.fill();
  });
  blurCtx.clearRect(0, 0, blurCvs.width, blurCvs.height);
  blurCtx.filter = 'blur(18px)';
  blurCtx.drawImage(maskCvs, 0, 0, blurCvs.width, blurCvs.height);
  blurCtx.filter = 'none';
}

let smoothPts = null;
function smoothLandmarks(raw) {
  if (!smoothPts) {
    smoothPts = raw.map(p => ({ x: p.x, y: p.y, z: p.z }));
    return smoothPts;
  }
  const k = 0.45;
  for (let i = 0; i < raw.length; i++) {
    smoothPts[i].x += (raw[i].x - smoothPts[i].x) * k;
    smoothPts[i].y += (raw[i].y - smoothPts[i].y) * k;
    smoothPts[i].z += (raw[i].z - smoothPts[i].z) * k;
  }
  return smoothPts;
}

// ============================================================
//  DYNAMIC SCRIPT LOADER (fix: no more static script tags)
// ============================================================
function loadScript(url, timeout) {
  timeout = timeout || 15000;
  return new Promise((resolve, reject) => {
    // Already loaded?
    if (url.includes('hands') && typeof Hands !== 'undefined') { resolve(); return; }
    if (url.includes('camera_utils') && typeof Camera !== 'undefined') { resolve(); return; }
    const timer = setTimeout(() => reject(new Error('加载超时: ' + url)), timeout);
    const s = document.createElement('script');
    s.src = url;
    s.crossOrigin = 'anonymous';
    s.onload = () => { clearTimeout(timer); LOG('Loaded:', url); resolve(); };
    s.onerror = () => { clearTimeout(timer); reject(new Error('加载失败: ' + url)); };
    document.head.appendChild(s);
  });
}

const CDN = [
  'https://cdn.jsdelivr.net/npm',
  'https://unpkg.com',
];

async function loadMediaPipe(name) {
  for (const base of CDN) {
    try {
      const url = `${base}/@mediapipe/${name}/${name}.js`;
      await loadScript(url, 12000);
      return;
    } catch (e) {
      LOG('CDN fail:', base, name, e.message);
    }
  }
  throw new Error(`无法加载 ${name}，请检查网络连接或使用梯子`);
}

// ============================================================
//  MEDIAPIPE HANDS
// ============================================================
let handsMP = null;
let modelReady = false;

function createHands() {
  LOG('Creating Hands instance...');
  handsMP = new Hands({
    locateFile: file => {
      const url = `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      LOG('Model file:', url);
      return url;
    },
  });
  handsMP.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.5,
  });
  handsMP.onResults(results => {
    if (!modelReady) {
      modelReady = true;
      LOG('Model first frame processed!');
    }
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      curLandmarks = smoothLandmarks(results.multiHandLandmarks[0]);
    } else {
      curLandmarks = null;
      smoothPts = null;
    }
  });
}

let curLandmarks = null;

// ============================================================
//  CAMERA
// ============================================================
let camInstance = null;

async function startCam() {
  const video = document.getElementById('cam');
  camInstance = new Camera(video, {
    onFrame: async () => {
      if (handsMP) await handsMP.send({ image: video });
    },
    width: 1280,
    height: 720,
  });
  await camInstance.start();
  LOG('Camera started');
}

function waitForVideo() {
  return new Promise((resolve, reject) => {
    const video = document.getElementById('cam');
    const timeout = setTimeout(() => reject(new Error('摄像头启动超时')), 10000);
    const check = () => {
      if (video.videoWidth > 0 && video.videoHeight > 0) {
        clearTimeout(timeout);
        LOG('Video ready:', video.videoWidth, 'x', video.videoHeight);
        resolve();
      } else {
        requestAnimationFrame(check);
      }
    };
    video.onloadedmetadata = () => {
      LOG('Metadata loaded');
      check();
    };
    check();
  });
}

function waitForModel(timeout) {
  timeout = timeout || 12000;
  return new Promise(resolve => {
    const start = Date.now();
    const check = () => {
      if (modelReady || Date.now() - start > timeout) {
        LOG('Model ready:', modelReady);
        resolve();
      } else {
        setTimeout(check, 150);
      }
    };
    check();
  });
}

function configureCanvas() {
  const video = document.getElementById('cam');
  const out = document.getElementById('output');
  const vw = video.videoWidth, vh = video.videoHeight;
  out.width = vw;
  out.height = vh;
  maskCvs.width = Math.round(vw * 0.5);
  maskCvs.height = Math.round(vh * 0.5);
  blurCvs.width = Math.round(vw * 0.5);
  blurCvs.height = Math.round(vh * 0.5);
  LOG('Canvas configured:', vw, 'x', vh);
}

// ============================================================
//  RENDER
// ============================================================
const MODES = [
  { name: '液态玻璃', id: 0 },
  { name: '霓虹描边', id: 1 },
  { name: '能量护盾', id: 2 },
];

let state = {
  mode: 0,
  recording: false,
  hasBg: false,
  playing: false,
  time: 0,
  lastTs: 0,
  frames: 0,
  fps: 0,
};

function render(ts) {
  if (!state.playing) return;
  requestAnimationFrame(render);

  const dt = state.lastTs ? (ts - state.lastTs) / 1000 : 0.016;
  state.lastTs = ts;
  state.time += dt;

  state.frames++;
  if (state.frames % 20 === 0) {
    state.fps = Math.round(1 / Math.max(dt, 0.001));
    document.getElementById('fps').textContent = state.fps + ' FPS';
  }

  // Update camera texture
  const video = document.getElementById('cam');
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texCam);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

  // Update mask texture
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texMask);
  if (curLandmarks) {
    drawMask(curLandmarks);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, blurCvs);
  } else {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
      new Uint8Array([0,0,0,255]));
  }

  gl.uniform1f(uLoc.u_time, state.time);
  gl.uniform2f(uLoc.u_res, document.getElementById('output').width, document.getElementById('output').height);
  gl.uniform1f(uLoc.u_mode, state.mode);
  gl.uniform1f(uLoc.u_hasBg, state.hasBg ? 1.0 : 0.0);

  gl.viewport(0, 0, document.getElementById('output').width, document.getElementById('output').height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ============================================================
//  ACTIONS
// ============================================================
function switchMode() {
  state.mode = (state.mode + 1) % MODES.length;
  const el = document.getElementById('mode-hud');
  el.textContent = MODES[state.mode].name;
  el.style.borderColor = 'rgba(196,77,255,0.5)';
  setTimeout(() => { el.style.borderColor = 'rgba(255,255,255,0.08)'; }, 300);
}

function screenshot() {
  const f = document.createElement('div');
  f.className = 'flash';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 400);
  setTimeout(() => {
    const c = document.getElementById('output');
    c.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'glass_' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('截图已保存');
    }, 'image/png');
  }, 50);
}

let recorder = null;
let chunks = [];
function toggleRec() {
  if (state.recording) {
    recorder.stop();
    state.recording = false;
    document.getElementById('bRec').classList.remove('rec');
    document.getElementById('bRec').querySelector('.bl').textContent = '录屏';
    document.getElementById('rec-dot').style.display = 'none';
    showToast('录屏已保存');
  } else {
    const stream = document.getElementById('output').captureStream(30);
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9' : 'video/webm';
    recorder = new MediaRecorder(stream, { mimeType: mime });
    chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'glass_' + Date.now() + '.webm';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };
    recorder.start();
    state.recording = true;
    document.getElementById('bRec').classList.add('rec');
    document.getElementById('bRec').querySelector('.bl').textContent = '停止';
    document.getElementById('rec-dot').style.display = 'block';
    showToast('开始录屏');
  }
}

function uploadBg() { document.getElementById('bgIn').click(); }

document.getElementById('bgIn').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, texBg);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    state.hasBg = true;
    document.getElementById('bBg').classList.add('on');
    document.getElementById('bBg').querySelector('.bl').textContent = '背景 ✓';
    showToast('虚拟背景已启用');
  };
  img.src = URL.createObjectURL(file);
  e.target.value = '';
});

// ============================================================
//  EVENTS
// ============================================================
document.getElementById('bMode').addEventListener('click', switchMode);
document.getElementById('bShot').addEventListener('click', screenshot);
document.getElementById('bRec').addEventListener('click', toggleRec);
document.getElementById('bBg').addEventListener('click', uploadBg);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); switchMode(); }
  else if (e.code === 'KeyS') screenshot();
  else if (e.code === 'KeyR') toggleRec();
  else if (e.code === 'KeyB') uploadBg();
});

// ============================================================
//  INIT — fully sequential with progress
// ============================================================
async function init() {
  try {
    // 0. Protocol check
    if (location.protocol === 'file:') {
      showError('请使用 HTTP/HTTPS 服务器运行此页面（直接打开文件无法使用摄像头）');
      return;
    }

    // 1. WebGL
    setProgress(5, '初始化 WebGL...', 1);
    await delay(100);
    if (!initGL()) return;
    setProgress(18, 'WebGL 就绪', 1);

    // 2. Load MediaPipe scripts
    setProgress(22, '加载摄像头工具 (camera_utils)...', 2);
    await delay(50);
    await loadMediaPipe('camera_utils');
    setProgress(40, 'camera_utils 就绪', 2);

    setProgress(45, '加载手部检测引擎 (hands)...', 2);
    await delay(50);
    await loadMediaPipe('hands');
    setProgress(58, 'hands 引擎就绪', 2);

    // 3. Create Hands instance
    setProgress(62, '初始化手部检测...', 3);
    await delay(50);
    createHands();
    setProgress(68, '手部检测已配置', 3);

    // 4. Start camera
    setProgress(72, '启动摄像头...', 3);
    await delay(50);
    await startCam();
    setProgress(80, '等待视频流...', 4);

    // 5. Wait for video dimensions
    await waitForVideo();
    setProgress(88, '配置画布...');
    configureCanvas();

    // 6. Wait for model first frame
    setProgress(90, '加载手部模型 (首次较慢)...', 3);
    await waitForModel();
    setProgress(100, '就绪!', 4);

    // 7. Show app
    await delay(500);
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    state.playing = true;
    requestAnimationFrame(render);
    LOG('App started!');

  } catch (err) {
    LOG('Init error:', err);
    showError(err.message || '未知错误，请刷新重试');
  }
}

init();
</script>
